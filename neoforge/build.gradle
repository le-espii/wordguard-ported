plugins {
    id 'net.neoforged.moddev' version '2.0.78'
}

neoForge {
    version = rootProject.neoforge_version

    parchment {
        mappingsVersion = rootProject.parchment_version
        minecraftVersion = rootProject.parchment_mc_version
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    implementation project(":common")
    
    // Dependencia del Mod de WorldEdit para NeoForge (Local JAR)
    implementation files("../Referencias/worldedit-mod-7.3.8.jar")
    
    // Shading de worldguard-core (incluirlo en el mod jar final)
    shade("com.sk89q.worldguard:worldguard-core:${rootProject.worldguard_core_version}") {
        exclude group: 'com.sk89q.worldedit', module: 'worldedit-core'
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-bom'
    }

    // worldguard-core depende transitivamente de worldguard-libs:core (resolución de
    // perfiles/UUID de jugador vía ProfileService y el índice espacial PR-tree que usa el
    // gestor de regiones) pero shadear solo "worldguard-core" arriba NO arrastra ese
    // artefacto al jar final: compila bien (está en el classpath de compilación) pero explota
    // en tiempo de ejecución con NoClassDefFoundError en cuanto ModWorldGuardPlatform
    // construye su ProfileService. Hay que shadearlo aparte.
    shade "com.sk89q.worldguard.worldguard-libs:core:${rootProject.worldguard_core_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : rootProject.minecraft_version,
        neoforge_version       : rootProject.neoforge_version,
        mod_id                 : rootProject.mod_id,
        mod_name               : rootProject.mod_name,
        mod_version            : rootProject.mod_version,
        mod_authors            : rootProject.mod_authors,
        mod_description        : rootProject.mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

jar {
    archiveFileName = "worldguard-neoforge-${version}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Empaquetar clases comunes
    from project(":common").sourceSets.main.output

    // Empaquetar clases de worldguard-core
    from {
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "module-info.class"
        exclude "META-INF/versions/*/module-info.class"
        exclude "META-INF/maven/**"
        exclude "META-INF/LICENSE*"
        exclude "META-INF/NOTICE*"
    }
    
    manifest {
        attributes([
            "MixinConfigs": "worldguard.mixins.json,worldguard-neoforge.mixins.json"
        ])
    }
}

